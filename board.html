<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ProjectFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="assets/app.js"></script>
</head>

<body data-page="board" data-title="Board">
    <main id="page" class="p-6 lg:p-8">
        <div class="mb-6 flex flex-wrap items-center gap-3"><select
                class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm font-medium">
                <option>Website redesign</option>
                <option>Mobile app</option>
            </select>
            <input id="q" placeholder="Search tasks"
                class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none"><select
                id="pf" class="rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm">
                <option>All priorities</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>
            </select>
            <span class="flex -space-x-2 pl-2"></span><button onclick="t.showModal()"
                class="ml-auto rounded-lg bg-primary-500 px-4 py-2 font-semibold text-white hover:bg-primary-600">New
                task</button>
        </div>
        <div id="cols" class="grid gap-4 overflow-x-auto md:grid-cols-2 xl:grid-cols-4"></div>
        <dialog id="t" class="w-full max-w-lg rounded-3xl p-6 backdrop:bg-black/40">
            <div class="grid gap-4">
                <div class="flex items-start justify-between">
                    <h3 id="tt" class="text-xl font-semibold">Task</h3>
                    <form method="dialog"><button class="rounded-full p-1 hover:bg-zinc-100"
                            aria-label="Close"></button></form>
                </div>
                <div id="tm" class="flex flex-wrap gap-2"></div><label class="text-sm font-medium">Description<textarea
                        rows="3"
                        class="mt-2 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-4 py-2 focus:border-primary-500 focus:outline-none"
                        placeholder="What needs to happen?"></textarea></label>
                <div class="grid grid-cols-3 gap-3"><label class="text-sm font-medium">Due<input type="date"
                            class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-2"></label><label
                        class="text-sm font-medium">Estimate (h)<input type="number" value="4"
                            class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-3"></label><label
                        class="text-sm font-medium">Priority<select
                            class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-2">
                            <option>Medium</option>
                            <option>High</option>
                            <option>Low</option>
                            <option>Critical</option>
                        </select></label></div>
                <p class="text-sm font-medium">Comments</p>
                <p class="rounded-lg bg-[#f5f5f7] p-3 text-sm"><b>Sarah:</b> Wireframes are ready for review.</p>
                <form method="dialog" class="flex justify-end gap-2"><a href="task.html"
                        class="mr-auto self-center text-sm font-medium text-primary-500 hover:underline">Open full
                        task</a><button class="rounded-lg bg-gray-200 px-4 py-2 font-semibold">Close</button><button
                        class="rounded-lg bg-primary-500 px-4 py-2 font-semibold text-white">Save task</button></form>
            </div>
        </dialog>
        <script>
            const T = [['Todo', 'Write copy for pricing page', 'Medium', 'Mia Chen', 'Nov 9', 0], ['Todo', 'Collect client logos', 'Low', 'Sarah Lee', 'Nov 12', 1], ['In Progress', 'Design homepage', 'High', 'Sarah Lee', 'Nov 4', 2], ['In Progress', 'Build navigation component', 'Medium', 'Alex Balakirev', 'Nov 6', 1], ['In Progress', 'Set up analytics', 'Low', 'John Doe', 'Nov 8', 0], ['Review', 'Accessibility audit', 'Critical', 'John Doe', 'Nov 3', 3], ['Review', 'Hero illustration', 'Medium', 'Mia Chen', 'Nov 5', 1], ['Done', 'Choose colour palette', 'Medium', 'Sarah Lee', 'Oct 28', 0], ['Done', 'Kick-off meeting notes', 'Low', 'Alex Balakirev', 'Oct 25', 2]];
            const S = ['Todo', 'In Progress', 'Review', 'Done']; let drag = null;
            function draw() {
                cols.innerHTML = ''; const q = document.getElementById('q').value.toLowerCase(), p = pf.value; S.forEach(s => {
                    const items = T.map((x, i) => [x, i]).filter(([x]) => x[0] == s && x[1].toLowerCase().includes(q) && (p[0] == 'A' || x[2] == p));
                    const c = document.createElement('section'); c.className = 'min-h-[320px] rounded-3xl bg-zinc-100 p-3'; c.innerHTML = '<div class="mb-3 flex items-center justify-between px-2"><h3 class="font-semibold" style="color:' + ST[s] + '">' + s + ' <span class="ml-1 text-slate-400">' + items.length + '</span></h3></div><div class="grid gap-3"></div>';
                    c.ondragover = e => e.preventDefault(); c.ondrop = () => { if (drag != null) { T[drag][0] = s; drag = null; draw() } };
                    items.forEach(([x, i]) => {
                        const a = document.createElement('article'); a.draggable = true; a.className = 'cursor-grab rounded-2xl border border-slate-100 bg-white p-4 shadow-sm hover:shadow-md active:cursor-grabbing'; a.ondragstart = () => drag = i; a.onclick = () => { tt.textContent = x[1]; tm.innerHTML = chip(x[0], ST[x[0]]) + chip(x[2], PR[x[2]]); t.showModal() };
                        a.innerHTML = '<div class="mb-2">' + chip(x[2], PR[x[2]]) + '</div><h4 class="font-medium">' + x[1] + '</h4><div class="mt-4 flex items-center justify-between text-xs text-slate-500"><span class="flex items-center gap-1">' + ic('cal', 'h-4 w-4') + x[4] + '</span><span class="flex items-center gap-1">' + (x[5] ? ic('clip', 'h-4 w-4') + x[5] : '') + '</span>' + av(x[3], 7) + '</div>'; c.lastChild.appendChild(a)
                    });
                    cols.appendChild(c)
                })
            }
            document.addEventListener('DOMContentLoaded', () => { draw(); q.oninput = draw; pf.onchange = draw; document.querySelector('#t button').innerHTML = ic('x'); document.querySelector('span.flex.-space-x-2').innerHTML = ['Sarah Lee', 'Alex Balakirev', 'John Doe', 'Mia Chen'].map(n => av(n, 9)).join('') });
        </script>
    </main>
</body>

</html>
