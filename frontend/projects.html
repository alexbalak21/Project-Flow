<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ProjectFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="assets/app.js"></script>
</head>

<body data-page="projects" data-title="Projects">
    <main id="page" class="p-6 lg:p-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div id="tabs" class="flex flex-wrap gap-2"></div><button onclick="m.showModal()"
                class="rounded-lg bg-primary-500 px-4 py-2 font-semibold text-white hover:bg-primary-600">New
                project</button>
        </div>
        <div id="grid" class="grid gap-6 md:grid-cols-2 2xl:grid-cols-3"></div>
        <dialog id="m" class="w-full max-w-md rounded-3xl p-6 backdrop:bg-black/40">
            <form method="dialog" class="grid gap-4">
                <h3 class="text-xl font-semibold">New project</h3>
                <label class="text-sm font-medium">Name<input
                        class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-4 focus:border-primary-500 focus:outline-none"
                        placeholder="Website redesign"></label>
                <label class="text-sm font-medium">Description<textarea rows="3"
                        class="mt-2 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-4 py-2 focus:border-primary-500 focus:outline-none"></textarea></label>
                <div class="grid grid-cols-2 gap-3"><label class="text-sm font-medium">Start date<input type="date"
                            class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-3"></label><label
                        class="text-sm font-medium">End date<input type="date"
                            class="mt-2 h-11 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-3"></label></div>
                <div class="flex justify-end gap-2"><button
                        class="rounded-lg bg-gray-200 px-4 py-2 font-semibold">Cancel</button><button
                        class="rounded-lg bg-primary-500 px-4 py-2 font-semibold text-white">Create project</button>
                </div>
            </form>
        </dialog>
        <script>
            const D = [['Website redesign', 'Active', 'Responsive marketing site and new pricing page.', 8, 14, ['Sarah Lee', 'Alex Balakirev', 'Mia Chen'], 'Nov 30'], ['Mobile app', 'Active', 'Android client for timers and notifications.', 5, 20, ['John Doe', 'Alex Balakirev'], 'Jan 15'], ['Launch campaign', 'Planned', 'Emails, social posts and beta invitations.', 0, 9, ['Mia Chen'], 'Dec 10'], ['Billing', 'On Hold', 'Stripe integration and plan limits.', 3, 12, ['John Doe', 'Sarah Lee'], 'Dec 20'], ['Brand refresh', 'Completed', 'Logo, colours and style guide.', 6, 6, ['Mia Chen', 'Sarah Lee'], 'Oct 12']];
            let f = 'All'; function draw() {
                grid.innerHTML = ''; D.filter(p => f == 'All' || p[1] == f).forEach(p => { const pc = Math.round(p[3] / p[4] * 100); grid.insertAdjacentHTML('beforeend', '<a href="board.html" class="block rounded-3xl border border-slate-100 bg-white p-6 shadow-sm hover:shadow-md"><div class="mb-3 flex items-center justify-between">' + chip(p[1], ST[p[1]]) + '<span class="text-xs text-slate-400">Ends ' + p[6] + '</span></div><div class="border-l-4 border-cyan-500 pl-4"><h3 class="text-xl font-semibold">' + p[0] + '</h3><p class="mt-2 text-sm text-slate-500">' + p[2] + '</p><p class="mt-4 text-sm font-semibold">Tasks done: ' + p[3] + ' / ' + p[4] + '</p><div class="mt-2 h-2.5 overflow-hidden rounded-full bg-slate-200"><div class="h-full rounded-full bg-cyan-500" style="width:' + pc + '%"></div></div></div><div class="mt-5 flex -space-x-2">' + p[5].map(n => av(n, 9)).join('') + '</div></a>') });
                tabs.innerHTML = ['All', 'Planned', 'Active', 'On Hold', 'Completed'].map(t => '<button onclick="f=\'' + t + '\';draw()" class="rounded-lg px-4 py-2 text-sm font-medium ' + (t == f ? 'bg-primary-500 text-white' : 'bg-white text-slate-600 hover:bg-zinc-100') + '">' + t + '</button>').join('')
            }
            document.addEventListener('DOMContentLoaded', draw);
        </script>
    </main>
</body>

</html>
