<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ProjectFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="assets/app.js"></script>
</head>

<body class="min-h-screen bg-[#f3f3f5] font-sans lg:grid lg:grid-cols-[58%_42%]">
    <section class="flex min-h-screen flex-col px-6 py-8 sm:px-10 lg:px-14">
        <p class="text-3xl font-semibold tracking-tight text-primary-500">ProjectFlow</p>
        <div class="flex flex-1 items-center">
            <form action="dashboard.html" class="mx-auto grid w-full max-w-md gap-5">
                <div>
                    <h1 class="text-center text-4xl font-semibold tracking-tight">Welcome back</h1>
                    <p class="mt-3 text-center text-slate-600">Log in to pick up where your team left off.</p>
                </div>
                <label class="block text-sm font-medium text-gray-700">Email<input type="email" required
                        value="alex@projectflow.app"
                        class="mt-2 h-12 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-4 text-base focus:border-primary-500 focus:outline-none"></label>
                <label class="block text-sm font-medium text-gray-700">Password<input type="password" required
                        minlength="8" value="password1234"
                        class="mt-2 h-12 w-full rounded-lg border border-[#e8e8ec] bg-[#f5f5f7] px-4 text-base focus:border-primary-500 focus:outline-none"></label>
                <div class="flex justify-between text-sm"><label class="flex items-center gap-2"><input type="checkbox"
                            checked class="accent-blue-600">Remember me</label><a href="#"
                        class="text-primary-500 hover:underline">Forgot password?</a></div>
                <button class="h-12 rounded-lg bg-primary-500 font-semibold text-white hover:bg-primary-600">Log
                    in</button>
                <p class="text-center text-sm text-slate-600">New to ProjectFlow? <a href="#"
                        class="font-medium text-primary-500 hover:underline">Create a workspace</a></p>
            </form>
        </div>
    </section>
    <aside
        class="hidden bg-gradient-to-br from-primary-700 to-primary-500 p-14 text-white lg:flex lg:flex-col lg:justify-end">
        <p class="max-w-sm text-3xl font-semibold leading-snug">Plan projects, assign tasks and ship, without the
            enterprise overhead.</p>
        <p class="mt-4 text-blue-100">Free for small teams. Pro from €12/month.</p>
    </aside>
</body>

</html>
